name: Build Supported Platforms

on:
  push:
    paths-ignore:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.sh"
      - "**/*.1"
      - "**/*.1.gz"
      - "doc/**"
      - "man/**"
      - "html/**"
  pull_request:
    paths-ignore:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.sh"
      - "**/*.1"
      - "**/*.1.gz"
      - "doc/**"
      - "man/**"
      - "html/**"
  workflow_dispatch:

jobs:
  linux_i686:
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
      SDL_TAG: release-3.4.14
      PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            build-essential cmake ninja-build git make nasm python3 pkg-config \
            clang-format-19 \
            gcc-multilib g++-multilib libc6-dev-i386 \
            libx11-dev:i386 libxcursor-dev:i386 libxi-dev:i386 \
            libxinerama-dev:i386 libxfixes-dev:i386 libxrandr-dev:i386 \
            libgl1-mesa-dev:i386 zlib1g-dev:i386 libpng-dev:i386 \
            libao-dev:i386 libpipewire-0.3-dev:i386
          sudo ln -sf /usr/bin/clang-format-19 /usr/local/bin/clang-format
      - name: Install SDL3 (i386)
        run: |
          if apt-cache show libsdl3-dev:i386 >/dev/null 2>&1; then
            sudo apt-get $APT_OPTS install -y --no-install-recommends libsdl3-dev:i386
          else
            rm -rf /tmp/SDL
            git clone --depth 1 --branch $SDL_TAG \
              https://github.com/libsdl-org/SDL.git /tmp/SDL
            cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF \
              -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
              -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF \
              -DSDL_JACK=OFF -DSDL_SNDIO=OFF \
              -DCMAKE_C_FLAGS='-m32' -DCMAKE_CXX_FLAGS='-m32'
            cmake --build /tmp/SDL/build --parallel
            sudo cmake --install /tmp/SDL/build
            echo '/usr/local/lib' | sudo tee /etc/ld.so.conf.d/zsnes-ci-sdl3.conf
            sudo ldconfig
            echo 'PKG_CONFIG_PATH=/usr/local/lib/pkgconfig' >> "$GITHUB_ENV"
          fi
      - name: Check formatting
        run: |
          make fmt
          if ! git diff --quiet; then
            git --no-pager diff --name-only
            exit 1
          fi
      - name: Build
        run: |
          make clean
          make linux_i686
          test -x ./zsnes
          file ./zsnes | grep -q 'ELF 32-bit'
      - name: Unit tests
        run: make -C test run
      - name: Cross-word-size check
        run: make -C test spc64
      - name: Run the 32-bit executable
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ZSNES_SELFTEST=1 ./zsnes -v 0
      - name: Verify runtime links
        run: |
          ldd ./zsnes | tee ldd.txt
          grep -E 'libSDL3|SDL3' ldd.txt
          grep -E 'libpipewire-0\.3' ldd.txt

  linux_x86_64:
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
      SDL_TAG: release-3.4.14
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            build-essential make nasm python3 pkg-config git \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            libsdl3-dev libgl1-mesa-dev libpng-dev zlib1g-dev \
            libao-dev libpipewire-0.3-dev
      - name: Build and run 64-bit
        run: |
          make clean
          make linux_x86_64
          test -x ./zsnes
          ZSNES_SELFTEST=1 ./zsnes -v 0
      - name: Portability gate
        run: |
          command -v aarch64-linux-gnu-gcc >/dev/null 2>&1 \
            || { echo "aarch64 cross compiler missing; portcheck would skip it"; exit 1; }
          make portcheck
      - name: AddressSanitizer
        run: |
          make clean
          make linux_x86_64 \
            EXTRA_CFLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            EXTRA_LDFLAGS='-fsanitize=address'
          ASAN_OPTIONS=detect_leaks=0 ZSNES_SELFTEST=1 ./zsnes -v 0
          make clean
      - name: Cross-unit type gate
        run: |
          make clean
          make linux_x86_64 \
            EXTRA_CFLAGS='-flto -Werror=lto-type-mismatch -Werror=odr -Werror=strict-aliasing' \
            EXTRA_LDFLAGS='-flto -Werror=lto-type-mismatch -Werror=odr -Werror=strict-aliasing'
          test -x ./zsnes
          ZSNES_SELFTEST=1 ./zsnes -v 0
          make clean


  difftests:
    name: difftests (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
      SDL_TAG: release-3.4.14
      PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: mvall
            targets: mvall
          - shard: heavy
            targets: t8to mvs op sa1op dbgop memops
          - shard: rest
            targets: >-
              spcdec 2xsai fxtable fxops m716t cb16t cb16b spr16bt spr16t spr16p
              t8bt t16bt t8t t16t thi sprwin ngspr procwin mos ngeng ngframe
              mv16 m7draw m7proc m7bw m7win m7start m7ext2 m7calc regs transp
              bgt ng2
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            build-essential cmake ninja-build git make nasm python3 pkg-config \
            gcc-multilib g++-multilib libc6-dev-i386 \
            libx11-dev:i386 libxcursor-dev:i386 libxi-dev:i386 \
            libxinerama-dev:i386 libxfixes-dev:i386 libxrandr-dev:i386 \
            libgl1-mesa-dev:i386 zlib1g-dev:i386 libpng-dev:i386 \
            libao-dev:i386 libpipewire-0.3-dev:i386
      - name: Install SDL3 (i386)
        run: |
          if apt-cache show libsdl3-dev:i386 >/dev/null 2>&1; then
            sudo apt-get $APT_OPTS install -y --no-install-recommends libsdl3-dev:i386
          else
            rm -rf /tmp/SDL
            git clone --depth 1 --branch $SDL_TAG \
              https://github.com/libsdl-org/SDL.git /tmp/SDL
            cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF \
              -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
              -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF \
              -DSDL_JACK=OFF -DSDL_SNDIO=OFF \
              -DCMAKE_C_FLAGS='-m32' -DCMAKE_CXX_FLAGS='-m32'
            cmake --build /tmp/SDL/build --parallel
            sudo cmake --install /tmp/SDL/build
            echo '/usr/local/lib' | sudo tee /etc/ld.so.conf.d/zsnes-ci-sdl3.conf
            sudo ldconfig
            echo 'PKG_CONFIG_PATH=/usr/local/lib/pkgconfig' >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          make clean
          make linux_i686
      - name: Differential tests
        run: |
          for t in ${{ matrix.targets }}; do
            echo "=== $t"
            make -C test "$t" || exit 1
          done
      - name: Differential tests at release optimisation
        if: matrix.shard == 'rest'
        run: |
          for t in regs cb16b cb16t fxtable mv16 procwin; do
            echo "=== $t -O3"
            make -C test "$t" OPT=-O3 || exit 1
          done

  linux_aarch64:
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
      SDL_TAG: release-3.4.14
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            make pkg-config curl cmake ninja-build git
      - name: Build zlib for aarch64
        run: |
          sha=bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
          for url in \
            https://zlib.net/fossils/zlib-1.3.2.tar.gz \
            https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          do
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
              -o zlib.tar.gz "$url" || continue
            if echo "$sha  zlib.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
              break
            fi
            echo "zlib: bad checksum from $url, trying the next source"
          done
          echo "$sha  zlib.tar.gz" | sha256sum -c -
          tar xzf zlib.tar.gz
          cd zlib-1.3.2
          CC=aarch64-linux-gnu-gcc ./configure --static \
            --prefix=/usr/aarch64-linux-gnu
          make -j"$(nproc)"
          sudo make install
      - name: Build SDL3 for aarch64
        run: |
          git clone --depth 1 --branch $SDL_TAG \
            https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/aarch64-linux-gnu \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF \
            -DSDL_JACK=OFF -DSDL_SNDIO=OFF
          cmake --build /tmp/SDL/build --parallel
          sudo cmake --install /tmp/SDL/build
      - name: Build
        run: |
          make clean
          make linux_aarch64
          file ./zsnes | grep -q aarch64

  linux_aarch64_native:
    name: linux_aarch64 (native)
    runs-on: ubuntu-26.04-arm
    env:
      DEBIAN_FRONTEND: noninteractive
      APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
      SDL_TAG: release-3.4.14
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            build-essential cmake ninja-build git make pkg-config zlib1g-dev \
            libgl1-mesa-dev libpng-dev
      - name: Install SDL3
        run: |
          git clone --depth 1 --branch $SDL_TAG \
            https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF \
            -DSDL_JACK=OFF -DSDL_SNDIO=OFF
          cmake --build /tmp/SDL/build --parallel
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig
          echo 'PKG_CONFIG_PATH=/usr/local/lib/pkgconfig' >> "$GITHUB_ENV"
      - name: Build and run
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          make clean
          make
          file ./zsnes | grep -q aarch64
          ZSNES_SELFTEST=1 ./zsnes -v 0

  windows:
    name: win
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
      SDL_TAG: release-3.4.14
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            mingw-w64 \
            libz-mingw-w64-dev \
            nasm python3 pkg-config
      - name: Build 32-bit
        run: |
          make clean
          make win_i686 WITH_PNG=
          test -f ./zsnes.exe
      - name: Build 64-bit
        run: |
          make clean
          make win_x86_64 WITH_PNG=
          test -f ./zsnes.exe
      - uses: actions/upload-artifact@v7
        with:
          name: zsnes-win64
          path: zsnes.exe

  windows-run:
    name: win (run)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zsnes-win64
      - name: Run the executable
        shell: cmd
        run: |
          set ZSNES_SELFTEST=1
          zsnes.exe -v 0

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          brew untap aws/tap || true
          brew update
          brew install pkgconf sdl3 libpng libao
      - name: Build
        run: |
          make clean
          make
          test -x ./zsnes
      - name: Run the executable
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ZSNES_SELFTEST=1 ./zsnes -v 0
      - name: Unit tests
        run: make -C test run
