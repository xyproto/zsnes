name: Build Supported Platforms

on:
  push:
    paths-ignore:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.sh"
      - "**/*.1"
      - "**/*.1.gz"
      - "doc/**"
      - "man/**"
      - "html/**"
  pull_request:
    paths-ignore:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.sh"
      - "**/*.1"
      - "**/*.1.gz"
      - "doc/**"
      - "man/**"
      - "html/**"
  workflow_dispatch:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gcc-multilib \
            g++-multilib \
            git \
            libc6-dev-i386 \
            make \
            nasm \
            ninja-build \
            python3 \
            pkg-config \
            clang-format-19 \
            libxcursor-dev:i386 \
            libxi-dev:i386 \
            libxinerama-dev:i386 \
            libx11-dev:i386 \
            libxfixes-dev:i386 \
            libxrandr-dev:i386 \
            libgl1-mesa-dev:i386 \
            libgl1-mesa-dev \
            libpng-dev \
            zlib1g-dev:i386 \
            libpng-dev:i386 \
            libao-dev:i386 \
            libpipewire-0.3-dev:i386
          sudo ln -sf /usr/bin/clang-format-19 /usr/local/bin/clang-format
      - name: Install SDL3 (i386)
        run: |
          if apt-cache show libsdl3-dev:i386 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libsdl3-dev:i386
          else
            rm -rf /tmp/SDL
            git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
            cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DSDL_SHARED=ON \
              -DSDL_STATIC=OFF \
              -DSDL_X11=OFF \
              -DSDL_WAYLAND=OFF \
              -DSDL_KMSDRM=OFF \
              -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF \
              -DSDL_PULSEAUDIO=OFF \
              -DSDL_PIPEWIRE=OFF \
              -DSDL_JACK=OFF \
              -DSDL_SNDIO=OFF \
              -DCMAKE_C_FLAGS='-m32' \
              -DCMAKE_CXX_FLAGS='-m32'
            cmake --build /tmp/SDL/build --parallel
            sudo cmake --install /tmp/SDL/build
            echo '/usr/local/lib' | sudo tee /etc/ld.so.conf.d/zsnes-ci-sdl3.conf
            sudo ldconfig
            echo 'PKG_CONFIG_PATH=/usr/local/lib/pkgconfig' >> "$GITHUB_ENV"
          fi
      - name: Install SDL3 (amd64)
        # The i386 build above is the only SDL the runner had, so "make
        # linux64" found none and stopped. This one lives in its own prefix so
        # the two never answer for each other.
        run: |
          rm -rf /tmp/SDL64
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL64
          cmake -S /tmp/SDL64 -B /tmp/SDL64/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3-amd64 \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_X11=OFF \
            -DSDL_WAYLAND=OFF \
            -DSDL_KMSDRM=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_ALSA=OFF \
            -DSDL_PULSEAUDIO=OFF \
            -DSDL_PIPEWIRE=OFF \
            -DSDL_JACK=OFF \
            -DSDL_SNDIO=OFF
          cmake --build /tmp/SDL64/build --parallel
          sudo cmake --install /tmp/SDL64/build
          echo '/opt/sdl3-amd64/lib' | sudo tee /etc/ld.so.conf.d/zsnes-ci-sdl3-amd64.conf
          sudo ldconfig
      - name: Check formatting
        run: |
          make fmt
          if ! git diff --quiet; then
            git --no-pager diff --name-only
            exit 1
          fi
      - name: Build
        run: |
          make clean
          make ARCH=linux
          test -x ./zsnes
      - name: Unit tests
        run: make -C test run
      - name: Cross-word-size check
        # Every difftest builds -m32, where zreg and u4 are the same type, so a
        # 64-bit width bug cannot show up in one. This runs a core at both
        # widths and compares.
        run: make -C test spc64
      - name: Differential tests
        # These prove each ported routine still bit-identical to the assembly
        # it replaced; they are what catches a porting regression.
        run: |
          for t in spcdec fxtable fxops memops mvs mvall m716t cb16t cb16b \
                   spr16bt spr16t spr16p t8bt t16bt t8t t16t t8to thi \
                   sprwin ngspr procwin mos ngeng ngframe mv16 m7draw \
                   m7proc m7bw m7win m7start m7ext2 m7calc regs op sa1op \
                   dbgop transp bgt ng2; do
            echo "=== $t"
            make -C test "$t" || exit 1
          done
      - name: Run the 32-bit executable
        # A binary that links is not a binary that runs. ZSNES_SELFTEST checks
        # the allocations and the pointers handed between units, then exits,
        # so it needs no ROM and no display. Reuses the build above.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ZSNES_SELFTEST=1 ./zsnes -v 0
      - name: Verify runtime links
        run: |
          ldd ./zsnes | tee ldd.txt
          grep -E 'libSDL3|SDL3' ldd.txt
          grep -E 'libpipewire-0\.3' ldd.txt
      - name: Build and run 64-bit
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PKG_CONFIG_LIBDIR: /opt/sdl3-amd64/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: ""
        run: |
          make clean
          make linux64
          test -x ./zsnes
          ZSNES_SELFTEST=1 ./zsnes -v 0

      - name: Portability gate
        run: make portcheck
      - name: AddressSanitizer
        # The difftests compare behaviour against the assembly, not memory
        # validity, so two global buffer overflows survived a green suite and
        # turned up only under ASan. The self-test covers the allocations, the
        # pointers handed between units, and the config written on exit.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PKG_CONFIG_LIBDIR: /opt/sdl3-amd64/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: ""
        run: |
          make clean
          make linux64 \
            EXTRA_CFLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            EXTRA_LDFLAGS='-fsanitize=address'
          ASAN_OPTIONS=detect_leaks=0 ZSNES_SELFTEST=1 ./zsnes -v 0
          make clean
  arm64:
    name: linux_arm64
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            make pkg-config curl cmake ninja-build git
      - name: Build zlib for aarch64
        # -lz is unconditional, and the distribution ships no arm64 zlib the
        # cross compiler can see. Building it is quicker than enabling the
        # ports archive.
        run: |
          curl -sL https://zlib.net/fossils/zlib-1.3.2.tar.gz | tar xz
          cd zlib-1.3.2
          CC=aarch64-linux-gnu-gcc ./configure --static \
            --prefix=/usr/aarch64-linux-gnu
          make -j"$(nproc)"
          sudo make install
      - name: Build SDL3 for aarch64
        # These targets have no other video backend, so the cross build needs
        # one in the sysroot the same way the native job does.
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/aarch64-linux-gnu \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF \
            -DSDL_JACK=OFF -DSDL_SNDIO=OFF
          cmake --build /tmp/SDL/build --parallel
          sudo cmake --install /tmp/SDL/build
      - name: Build
        # portcheck only compiles. This links, which is what catches a symbol
        # the addressing mode cannot reach: aarch64 scales the immediate of a
        # 16/32/64-bit load by its size, so an unaligned one fails here and
        # nowhere else.
        run: |
          make clean
          make linux_arm64
          file ./zsnes | grep -q aarch64

  arm64-native:
    name: linux_arm64 (native)
    runs-on: ubuntu-24.04-arm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git make pkg-config zlib1g-dev \
            libgl1-mesa-dev libpng-dev
      - name: Install SDL3
        # Ubuntu has no libsdl3-dev yet, and a native build stops without one.
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF \
            -DSDL_JACK=OFF -DSDL_SNDIO=OFF
          cmake --build /tmp/SDL/build --parallel
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig
          echo 'PKG_CONFIG_PATH=/usr/local/lib/pkgconfig' >> "$GITHUB_ENV"
      - name: Build and run
        # The cross job above proves it links; this one proves it runs.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          make clean
          make
          file ./zsnes | grep -q aarch64
          ZSNES_SELFTEST=1 ./zsnes -v 0

  windows:
    name: win
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            libz-mingw-w64-dev \
            nasm python3 pkg-config
      - name: Build 32-bit
        run: |
          make clean
          make win32 WITH_PNG=
          test -f ./zsnes.exe
      - name: Build 64-bit
        run: |
          make clean
          make win64 WITH_PNG=
          test -f ./zsnes.exe
      - uses: actions/upload-artifact@v4
        with:
          name: zsnes-win64
          path: zsnes.exe

  windows-run:
    name: win (run)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zsnes-win64
      - name: Run the executable
        shell: cmd
        run: |
          set ZSNES_SELFTEST=1
          zsnes.exe -v 0

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          brew update
          brew install pkgconf sdl3 libpng libao
      - name: Build
        # No ARCH needed: the default is the host, and on a Mac that is a
        # native Mach-O build, Apple Silicon or Intel.
        run: |
          make clean
          make
          test -x ./zsnes
      - name: Run the executable
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ZSNES_SELFTEST=1 ./zsnes -v 0
      - name: Unit tests
        # The difftests are 32-bit x86 only - they assemble the original
        # Assembly out of git history - so only the unit tests run here.
        run: make -C test run

